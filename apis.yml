aid: codekarma
name: CodeKarma
description: >-
  CodeKarma is a production intelligence platform that maps 100% of production
  traffic directly to source code, giving engineering teams and AI agents
  code-level visibility into how software actually behaves in production. Its
  products include KarmaLens (an IDE plugin for JetBrains and VS Code surfacing
  dead code, method frequency, and performance hotspots), KarmaDomain (live
  API-level dependency graphs across microservices, databases, and async
  systems), KarmaPulse (an operations command center with API health, error
  drift, and AI root cause analysis), and KarmaIQ (an MCP server that feeds
  production context to AI coding agents such as Cursor, Windsurf, GitHub
  Copilot, and Claude). Deployed as managed SaaS or bring-your-own-cloud
  (AWS, Azure, GCP), CodeKarma is SOC 2 Type 2 certified and collects only
  behavioral telemetry — no PII, payloads, or request bodies. Founded by
  Anantharam Vanchi Prakash and Priyanka Nahata, based in Bengaluru, India, and
  backed by Prosus, Accel, Xeed Ventures, SenseAI Ventures, and Stargazer
  Ventures.
